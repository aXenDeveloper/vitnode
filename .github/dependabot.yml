version: 2

updates:
  # One pnpm workspace: the root lockfile covers apps/*, packages/* and plugins/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Matches pnpm's `minimumReleaseAge`: a release has to survive a few days
    # before it lands here. Security updates are not delayed.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        update-types:
          - minor
          - patch
