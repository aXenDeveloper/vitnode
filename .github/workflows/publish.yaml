name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      release:
        description: stable, canary, or release candidate?
        required: true
        type: choice
        options:
          - canary
          - stable
          - release-candidate
      type:
        description: 'Type of package to publish'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      skip_bump_version:
        description: 'Skip bumping version in package.json and release notes?'
        required: false
        type: boolean

jobs:
  bump-version:
    name: 'Bump Version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9.12.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org/'
          node-version: 22

      - name: Install dependencies
        run: pnpm i --prod --ignore-scripts

      - name: Build CLI
        run: pnpm run build:scripts

      - name: Build Projects
        run: pnpm run build --filter=vitnode-backend --filter=vitnode-frontend --filter=vitnode-backend-email-resend --filter=vitnode-backend-email-smtp --filter=vitnode-shared

      - name: Run script to bump version & copy files
        if: github.event.inputs.skip_bump_version == 'false'
        run: pnpm run release
        id: version-bump
        env:
          VERSION_TYPE: ${{ github.event.inputs.type }}
          RELEASE_TYPE: ${{ github.event.inputs.release }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run script to only copy files
        if: github.event.inputs.skip_bump_version == 'true'
        run: pnpm run release --without-bump-version
        id: version-bump-without-bump-version
        env:
          VERSION_TYPE: ${{ github.event.inputs.type }}
          RELEASE_TYPE: ${{ github.event.inputs.release }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pre-release
        if: github.event.inputs.release == 'canary' || github.event.inputs.release == 'release-candidate' && github.event.inputs.skip_bump_version == 'false'
        run: gh release create ${{ steps.version-bump.outputs.newTag }} --generate-notes --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: github.event.inputs.release == 'stable' && github.event.inputs.skip_bump_version == 'false'
        run: gh release create ${{ steps.version-bump.outputs.newTag }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish canary
        if: github.event.inputs.release == 'canary'
        run: pnpm publish --access public --filter vitnode-backend --filter vitnode-backend-email-resend --filter vitnode-backend-email-smtp  --filter vitnode-frontend --filter create-vitnode-app --filter eslint-config-typescript-vitnode --filter vitnode-shared --tag canary --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish release candidate
        if: github.event.inputs.release == 'release-candidate'
        run: pnpm publish --access public --filter vitnode-backend --filter vitnode-backend-email-resend --filter vitnode-backend-email-smtp  --filter vitnode-frontend --filter create-vitnode-app --filter eslint-config-typescript-vitnode --filter vitnode-shared --tag rc --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish stable
        if: github.event.inputs.release == 'stable'
        run: pnpm publish --access public --filter vitnode-backend --filter vitnode-backend-email-resend --filter vitnode-backend-email-smtp  --filter vitnode-frontend --filter create-vitnode-app --filter eslint-config-typescript-vitnode --filter vitnode-shared --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
