name: Test publish version

on:
  workflow_dispatch:
    inputs:
      release:
        description: stable, canary, or release candidate?
        required: true
        type: choice
        options:
          - canary
          - stable
          - release-candidate
      type:
        description: 'Type of package to publish'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version:
    name: 'Bump Version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.10.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org/'
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run script to bump version & copy files
        run: pnpm run release
        id: version-bump
        env:
          VERSION_TYPE: ${{ github.event.inputs.type }}
          RELEASE_TYPE: ${{ github.event.inputs.release }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_EMAIL: ${{ github.actor }}@users.noreply.github.com

      - name: Publish
        run: pnpm publish --filter create-vitnode-app --tag canary --no-git-checks --access public
