name: Bump and Publish npm packages

on:
  workflow_dispatch:
    inputs:
      release:
        description: stable, canary, or release candidate?
        required: true
        type: choice
        options:
          - canary
          - release-candidate
          - stable
      type:
        description: "Type of package to publish"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      mode:
        description: "Mode of package to publish"
        required: true
        type: choice
        options:
          - bump_and_publish
          - bump
          - publish
      skip_release_github_patch_notes:
        description: "Skip generating release notes for GitHub patch notes?"
        required: false
        type: boolean

env:
  # Every package this workflow publishes. The publish steps and the update
  # manifest both read it, so the manifest never names a package npm did not get.
  PUBLISHED_PACKAGES: "create-vitnode-app @vitnode/core @vitnode/config @vitnode/blog @vitnode/nodemailer @vitnode/resend @vitnode/node-cron"

jobs:
  bump-version:
    name: "Bump Version"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      sha: ${{ steps.published.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          registry-url: "https://registry.npmjs.org/"
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run script to bump version & copy files
        run: pnpm run release
        id: version-bump
        env:
          VERSION_TYPE: ${{ github.event.inputs.type }}
          RELEASE_TYPE: ${{ github.event.inputs.release }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GITHUB_OPTION_MODE: ${{ github.event.inputs.mode }}

      - name: Build scripts
        run: pnpm run build:scripts

      - name: Build plugins
        run: pnpm run build:plugins

      - name: Publish canary
        if: ${{ (github.event.inputs.mode == 'bump_and_publish' || github.event.inputs.mode == 'publish') && github.event.inputs.release == 'canary' }}
        run: pnpm publish $(printf -- "--filter %s " $PUBLISHED_PACKAGES) --tag canary --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish release candidate
        if: ${{ (github.event.inputs.mode == 'bump_and_publish' || github.event.inputs.mode == 'publish') && github.event.inputs.release == 'release-candidate' }}
        run: pnpm publish $(printf -- "--filter %s " $PUBLISHED_PACKAGES) --tag rc --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish stable
        if: ${{ (github.event.inputs.mode == 'bump_and_publish' || github.event.inputs.mode == 'publish') && github.event.inputs.release == 'stable' }}
        run: pnpm publish $(printf -- "--filter %s " $PUBLISHED_PACKAGES) --tag latest --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create Pre-release
        if: (github.event.inputs.release == 'canary' || github.event.inputs.release == 'release-candidate') && !github.event.inputs.skip_release_github_patch_notes
        run: gh release create ${{ steps.version-bump.outputs.newTag }} --generate-notes --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: github.event.inputs.release == 'stable' && !github.event.inputs.skip_release_github_patch_notes
        run: gh release create ${{ steps.version-bump.outputs.newTag }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remember the published commit
        id: published
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-update-manifest:
    name: "Publish update manifest"
    needs: bump-version
    # Only after npm has the packages: a bump-only run publishes nothing, so it
    # advertises nothing.
    if: ${{ github.event.inputs.mode == 'bump_and_publish' || github.event.inputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with the advisories workflow: one writer of updates.json at a time.
    concurrency:
      group: vitnode-update-manifest
      cancel-in-progress: false

    steps:
      - name: Checkout the published commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.sha }}

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add the published versions to updates.json
        run: pnpm run release:update-manifest release
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
