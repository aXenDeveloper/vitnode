name: Build, Lint & Test

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitnode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6.0.9
        name: Install pnpm
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          registry-url: "https://registry.npmjs.org/"
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Scripts
        run: pnpm build:scripts

      - name: Build Plugins
        run: pnpm build:plugins

      - name: Run build
        run: pnpm build

      - name: Check formatting
        run: pnpm lint

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_TEST_URL: postgres://postgres:postgres@localhost:5432/vitnode_test

      - name: Run type tests
        run: pnpm test:types
