name: Build, Lint & Test

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Scripts
        run: pnpm build:scripts

      - name: Build Plugins
        run: pnpm build:plugins

      - name: Run build
        run: pnpm build

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packages-dist
          path: |
            packages/*/dist
            plugins/*/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: packages-dist

      - name: Run lint
        run: pnpm lint

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: packages-dist

      - name: Run tests
        run: pnpm turbo run test test:types --only --continue
