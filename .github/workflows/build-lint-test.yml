name: Build, Lint & Test

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Scripts
        run: pnpm build:scripts

      - name: Build Plugins
        run: pnpm build:plugins

      - name: Run build
        run: pnpm build

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packages-dist
          path: |
            packages/*/dist
            plugins/*/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: packages-dist

      - name: Run lint
        run: pnpm lint

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Real Postgres for the integration tests that need row locks and
    # `ON CONFLICT` (notifications). Each test file creates its own database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VITNODE_TEST_POSTGRES_URL: postgresql://root:root@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: packages-dist

      - name: Run tests
        run: pnpm turbo run test test:types --only --continue
