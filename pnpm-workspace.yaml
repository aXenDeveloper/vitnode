packages:
  - apps/*
  - packages/*
  - plugins/*
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: false
packageExtensions:
  '@tiptap/y-tiptap':
    dependencies:
      prosemirror-transform: 1.12.1
overrides:
  'next@>=16.2.0 <16.3.6': ~16.3.8
  'seroval@<1.6.3': ^1.6.8
  'seroval-plugins@<1.6.3': ^1.6.8
  'esbuild@>=0.27.3 <0.28.1': ^0.28.2
  'http-cache-semantics@<4.2.1': ^4.3.0
peerDependencyRules:
  allowedVersions:
    '@typescript-eslint/project-service>typescript': 7.1.0-beta
    '@typescript-eslint/tsconfig-utils>typescript': 7.1.0-beta
    '@typescript-eslint/typescript-estree>typescript': 7.1.0-beta
    '@typescript-eslint/utils>typescript': 7.1.0-beta
minimumReleaseAgeExclude:
  - '@fumadocs/base-ui@16.17.1'
  - '@fumadocs/tailwind@0.1.3'
  - fumadocs-core@16.17.1
