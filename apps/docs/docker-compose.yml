services:
  database:
    container_name: vitnode_postgres_dev_bun
    build:
      context: ../../docker/postgres
      dockerfile: Dockerfile
    image: vitnode-postgres-pl:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-root}
      POSTGRES_DB: ${POSTGRES_NAME-vitnode}
    volumes:
      - ../../docker/dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - vitnode_dev

  cache:
    container_name: vitnode_redis_dev_bun
    image: redis:8.8-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD-root}
    ports:
      - "6379:6379"
    networks:
      - vitnode_dev

networks:
  vitnode_dev:
